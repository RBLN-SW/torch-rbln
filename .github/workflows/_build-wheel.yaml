name: Build wheel

on:
  workflow_call:
    inputs:
      torch_rbln_sha:
        description: Git commit SHA
        type: string
        required: true
      python_version:
        description: Python version (3.10-3.13)
        type: string
        required: true
      build_type:
        description: Build type (Release, Debug)
        type: string
        required: true
    secrets:
      GIT_PAT:
        description: Personal access token
        required: true
      INTERNAL_INDEX_URL:
        description: Internal package index URL
        required: true
      INTERNAL_INDEX_USERNAME:
        description: Internal package index username
        required: true
      INTERNAL_INDEX_PASSWORD:
        description: Internal package index password
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build wheel
    if: ${{ github.repository_owner == 'RBLN-SW' }}
    runs-on: ${{ vars.TORCH_RBLN_RUNNER_CPU_LARGE }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    timeout-minutes: 60
    container:
      image: ghcr.io/rebellions-sw/rbln-build:0.11.0-ubi9-py${{ inputs.python_version }}  # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GIT_PAT }}
    steps:
      - name: Validate build type
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          case "${BUILD_TYPE}" in
            Release | Debug) ;;
            *) echo "::error::Invalid build_type '${BUILD_TYPE}'; allowed: Release, Debug"; exit 1 ;;
          esac

      - name: Check out torch-rbln repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ inputs.torch_rbln_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Check uv and Python versions
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail

          echo "::notice::uv binary: $(command -v uv)"
          uv --version
          echo "::notice::python binary: $(command -v python3)"
          python3 --version

          detected_python_version="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [[ "${detected_python_version}" != "${PYTHON_VERSION}" ]]; then
            echo "::error::Python ${detected_python_version} does not match python_version ${PYTHON_VERSION}"
            exit 1
          fi

      - name: Build wheel
        env:
          TORCH_RBLN_BUILD_TYPE: ${{ inputs.build_type }}
          UV_INDEX: rbln=${{ secrets.INTERNAL_INDEX_URL }}
          UV_INDEX_RBLN_USERNAME: ${{ secrets.INTERNAL_INDEX_USERNAME }}
          UV_INDEX_RBLN_PASSWORD: ${{ secrets.INTERNAL_INDEX_PASSWORD }}
          UV_BUILD_CONSTRAINT: constraints-build-dev.txt
        run: |
          set -euo pipefail

          [[ -f /etc/os-release ]] && . /etc/os-release
          case "${ID:-}:${ID_LIKE:-}" in
            *debian* | *ubuntu*) export CC=gcc-13 CXX=g++-13 ;;
            *) source /opt/rh/gcc-toolset-13/enable ;;
          esac
          cxx="${CXX:-g++}"
          echo "::notice::C++ compiler: $(command -v "${cxx}")"
          "${cxx}" --version
          echo "::notice::target: $("${cxx}" -dumpmachine)"

          uv build --wheel

      - name: Read built wheel version
        id: read_version
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          wheels=(dist/*.whl)
          shopt -u nullglob
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one wheel in dist/, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          wheel="${wheels[0]}"

          # Wheel filename fields (PEP 427): {name}-{version}-{python}-{abi}-{platform}.
          version="$(basename "${wheel}" | cut -d- -f2)"
          python_tag="$(basename "${wheel}" | cut -d- -f3)"
          if [[ "${python_tag}" != "cp${PYTHON_VERSION//./}" ]]; then
            echo "::error::Wheel Python tag '${python_tag}' does not match python_version ${PYTHON_VERSION}"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Built torch-rbln==${version}"

      - name: Verify the built wheel
        env:
          TORCH_RBLN_VERSION: ${{ steps.read_version.outputs.version }}
          BUILD_TYPE: ${{ inputs.build_type }}
          UV_INDEX: https://download.pytorch.org/whl/cpu rbln=${{ secrets.INTERNAL_INDEX_URL }}
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_INDEX_RBLN_USERNAME: ${{ secrets.INTERNAL_INDEX_USERNAME }}
          UV_INDEX_RBLN_PASSWORD: ${{ secrets.INTERNAL_INDEX_PASSWORD }}
        run: |
          set -euo pipefail

          uv venv verify-install/.venv
          uv pip install \
            --python verify-install/.venv/bin/python \
            --constraint constraints-build-dev.txt \
            rebel-compiler \
            dist/*.whl

          # `python -` puts cwd on sys.path; cd out of the repo root so the source doesn't shadow the installed wheel.
          cd verify-install
          .venv/bin/python - <<'PY'
          import os

          import rebel
          import torch
          import torch_rbln

          expected_version = os.environ["TORCH_RBLN_VERSION"]
          build_type = os.environ["BUILD_TYPE"]
          print(f"torch={torch.__version__} torch_rbln={torch_rbln.__version__} rebel={rebel.__version__}")

          assert torch_rbln.__version__ == expected_version, (
              f"torch-rbln version mismatch: expected {expected_version}, got {torch_rbln.__version__}"
          )
          if build_type == "Debug":
              assert "debug" in torch_rbln.__version__, (
                  f"Debug build is missing its debug marker: {torch_rbln.__version__}"
              )
          else:
              assert "debug" not in torch_rbln.__version__, (
                  f"Release build must not carry a debug marker: {torch_rbln.__version__}"
              )
          print(f"::notice::Verified torch-rbln=={torch_rbln.__version__} ({build_type})")
          PY

          # The import above cannot check the install RPATH: torch_rbln ctypes-loads librbln.so
          # before the extension, so the extension resolves it by SONAME against an already-mapped
          # library and RUNPATH is never consulted. Load the extension on its own so a wrong RPATH
          # fails here, not in whatever loads it without going through torch_rbln.
          #
          # Autoload off, because torch.backends autoloading is on by default and would import
          # torch_rbln -- and with it librbln.so -- out of `import torch` alone. LD_LIBRARY_PATH
          # cleared, because the loader consults it ahead of RUNPATH: an inherited one would
          # satisfy the dependency and leave the RUNPATH untested again.
          env -u LD_LIBRARY_PATH TORCH_DEVICE_BACKEND_AUTOLOAD=0 .venv/bin/python - <<'PY'
          import ctypes
          import os
          import re
          from importlib.metadata import distribution

          import torch  # noqa: F401  -- so libtorch resolves by SONAME, leaving librbln.so to RUNPATH

          def mapped_runtime_libs():
              with open("/proc/self/maps") as maps:
                  return sorted({os.path.realpath(p) for p in re.findall(r"/\S*librbln\.so", maps.read())})

          # Assert the precondition rather than assume it: if anything mapped librbln.so already,
          # the load below proves nothing and this check would pass no matter what the RPATH said.
          already = mapped_runtime_libs()
          if already:
              raise SystemExit(f"::error::librbln.so was already mapped ({already}); RPATH untested")

          # Read the record here rather than through torch_rbln._internal.rbln_runtime_lib:
          # importing that runs torch_backends_entry_point(), which maps the library itself.
          expected = os.path.realpath(
              str(next(f for f in distribution("rebel-compiler").files if f.name == "librbln.so").locate())
          )

          library = str(next(f for f in distribution("torch-rbln").files if f.name == "libtorch_rbln.so").locate())
          try:
              ctypes.CDLL(library)
          except OSError as e:
              raise SystemExit(f"::error::install RPATH does not resolve librbln.so: {e}") from e

          # Loading is not the property under test. Any librbln.so on the loader's search path
          # satisfies the NEEDED entry, so a wrong RUNPATH passes as long as some copy is findable
          # somewhere; what it has to do is reach the one rebel-compiler installed.
          mapped = mapped_runtime_libs()
          if mapped != [expected]:
              raise SystemExit(f"::error::RUNPATH resolved {mapped}, expected [{expected}]")
          print(f"::notice::Verified the install RPATH of {library} -> {expected}")
          PY

      - name: Publish wheel to internal package index
        env:
          TORCH_RBLN_VERSION: ${{ steps.read_version.outputs.version }}
          INTERNAL_INDEX_URL: ${{ secrets.INTERNAL_INDEX_URL }}
          UV_PUBLISH_USERNAME: ${{ secrets.INTERNAL_INDEX_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.INTERNAL_INDEX_PASSWORD }}
        run: |  # zizmor: ignore[use-trusted-publishing]
          set -euo pipefail

          # curl authenticates its index query via ~/.netrc.
          index_host="${INTERNAL_INDEX_URL#*://}"
          index_host="${index_host%%/*}"
          umask 077
          cat > "${HOME}/.netrc" <<EOF
          machine ${index_host}
          login ${UV_PUBLISH_USERNAME}
          password ${UV_PUBLISH_PASSWORD}
          EOF

          # Publish each version once; skip if it's already on the index.
          wheel_name="$(basename dist/*.whl)"
          if curl -fsSL --netrc "${INTERNAL_INDEX_URL%/}/torch-rbln/" | grep -qF -- "${wheel_name}"; then
            echo "::notice::torch-rbln==${TORCH_RBLN_VERSION} is already on the internal package index; skipping publish"
          else
            uv publish --publish-url "${INTERNAL_INDEX_URL}" dist/*.whl
            echo "::notice::Published torch-rbln==${TORCH_RBLN_VERSION} to the internal package index"
          fi

      - name: Verify the published wheel resolves from the index
        env:
          TORCH_RBLN_VERSION: ${{ steps.read_version.outputs.version }}
          UV_INDEX: https://download.pytorch.org/whl/cpu rbln=${{ secrets.INTERNAL_INDEX_URL }}
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_INDEX_RBLN_USERNAME: ${{ secrets.INTERNAL_INDEX_USERNAME }}
          UV_INDEX_RBLN_PASSWORD: ${{ secrets.INTERNAL_INDEX_PASSWORD }}
        run: |
          set -euo pipefail

          # The artifact was verified before publishing; this checks the other half, which that
          # cannot: that the upload landed and the version we built is resolvable by name. It is
          # the first thing a consumer hits, and it fails for reasons of its own -- a rejected
          # upload, or a version string the index does not end up serving.
          uv venv verify-index/.venv
          uv pip install \
            --python verify-index/.venv/bin/python \
            --constraint constraints-build-dev.txt \
            rebel-compiler \
            "torch-rbln==${TORCH_RBLN_VERSION}"

          # `python -` puts cwd on sys.path; stay out of the repo root so the source tree does not
          # shadow what we just installed.
          cd verify-index
          .venv/bin/python - <<'PY'
          import torch_rbln

          print(f"::notice::Installed torch-rbln=={torch_rbln.__version__} from the internal index")
          PY
