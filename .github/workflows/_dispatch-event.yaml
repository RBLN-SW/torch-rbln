name: Dispatch event

on:
  workflow_call:
    inputs:
      event_name:
        description: GitHub event name that triggered the workflow
        type: string
        required: true
      event_type:
        description: Event type for repository dispatch
        type: string
        required: true
      torch_rbln_ref:
        description: Git reference for torch-rbln (branch, tag, or SHA)
        type: string
        required: true
      torch_rbln_sha:
        description: Git commit SHA to include in the dispatch payload
        type: string
        required: true
    secrets:
      GIT_PAT:
        description: Personal access token for cross-repository dispatch
        required: true

permissions:
  contents: read

jobs:
  dispatch_event:
    name: Dispatch event for ${{ inputs.event_type }}
    if: ${{ github.repository_owner == 'RBLN-SW' }}
    runs-on: ${{ vars.TORCH_RBLN_RUNNER_CPU_SMALL }}
    timeout-minutes: 60
    container:
      image: ghcr.io/rebellions-sw/rbln-test:0.11.0-ubuntu22.04-py3.12
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GIT_PAT }}
    steps:
      - name: Dispatch ${{ inputs.event_type }} event
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea  # v3.8.0
        with:
          action: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
          attempt_limit: 5
          attempt_delay: 5000
          with: |
            token: ${{ secrets.GIT_PAT }}
            repository: ${{ vars.TORCH_RBLN_DISPATCH_REPOSITORY }}
            event-type: ${{ inputs.event_type }}
            client-payload: |
              {
                "event_name": "${{ inputs.event_name }}",
                "torch_rbln_ref": "${{ inputs.torch_rbln_ref }}",
                "torch_rbln_sha": "${{ inputs.torch_rbln_sha }}"
              }
