name: Lint source

on:
  workflow_call:
    inputs:
      torch_rbln_sha:
        description: Git commit SHA
        type: string
        required: true
      python_version:
        description: Python version to lint under (3.10-3.14)
        type: string
        required: true
      build_type:
        description: Build type (Release, Debug)
        type: string
        required: true
      base_revision:
        description: Revision to compute changed files from (empty means every tracked file)
        type: string
        required: true
    secrets:
      GIT_PAT:
        description: Personal access token
        required: true
      INTERNAL_INDEX_URL:
        description: Internal package index URL
        required: true
      INTERNAL_INDEX_USERNAME:
        description: Internal package index username
        required: true
      INTERNAL_INDEX_PASSWORD:
        description: Internal package index password
        required: true
      HARBOR_USERNAME:
        description: Container registry username
        required: true
      HARBOR_PASSWORD:
        description: Container registry password
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint_source:
    name: Lint source
    if: ${{ github.repository_owner == 'RBLN-SW' }}
    runs-on: ${{ vars.TORCH_RBLN_RUNNER_CPU_SMALL }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    timeout-minutes: 60
    container:
      image: harbor.mgmt.rbln.in/rebellions-sw/rbln-build:0.11.2-dev51-g5efce5e9a-ubi9.8-py${{ inputs.python_version }}  # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: Validate build type
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          case "${BUILD_TYPE}" in
            Release | Debug) ;;
            *)
              echo "::error::Invalid build_type '${BUILD_TYPE}'; allowed: Release, Debug"
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ inputs.torch_rbln_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      # Concurrent matrix jobs on one runner share its home directory, and uv
      # locks the source build of this project per cache entry: with the default
      # timeout every job but the one holding the lock fails. A cache under the
      # job's own temp directory keeps the jobs independent.
      - name: Keep the uv cache private to this job
        run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install dependencies
        env:
          UV_INDEX: rbln=${{ secrets.INTERNAL_INDEX_URL }}
          UV_INDEX_RBLN_USERNAME: ${{ secrets.INTERNAL_INDEX_USERNAME }}
          UV_INDEX_RBLN_PASSWORD: ${{ secrets.INTERNAL_INDEX_PASSWORD }}
        run: |
          set -euo pipefail

          # clang-tidy needs the Rebel runtime headers, which ship only in the build-pinned rebel-compiler.
          uv sync --no-install-project --no-install-package rebel-compiler
          uv pip install --constraint constraints-build-dev.txt rebel-compiler

      - name: Cache linter binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .lintbin
          # The binaries are native tools, independent of the Python version and build type.
          key: lintbin-${{ hashFiles('tools/linter/adapters/s3_init_config.json') }}

      - name: Initialize linters
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: uv run --no-sync lintrunner init

      - name: Configure CMake for clang-tidy
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          [[ -f /etc/os-release ]] && . /etc/os-release
          case "${ID:-}:${ID_LIKE:-}" in
            *debian* | *ubuntu*) export CC=gcc-13 CXX=g++-13 ;;
            *) source /opt/rh/gcc-toolset-13/enable ;;
          esac

          uv run --no-sync cmake -GNinja -B build -S . \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_INSTALL_PREFIX=torch_rbln

      - name: Run lintrunner
        env:
          BASE_REVISION: ${{ inputs.base_revision }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_REVISION}" ]; then
            uv run --no-sync lintrunner --paths-cmd='git ls-files'
          else
            uv run --no-sync lintrunner -m "${BASE_REVISION}"
          fi
