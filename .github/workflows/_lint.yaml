name: Lint

on:
  workflow_call:
    inputs:
      torch_rbln_sha:
        description: Git commit SHA
        type: string
        required: true
      python_versions:
        description: Python versions (3.10-3.14), as a JSON array
        type: string
        required: true
      build_types:
        description: Build types (Release, Debug), as a JSON array
        type: string
        required: true
      base_revision:
        description: Revision to compute changed files from (empty means every tracked file)
        type: string
        required: true
    secrets:
      GIT_PAT:
        description: Personal access token
        required: true
      HARBOR_USERNAME:
        description: Container registry username
        required: true
      HARBOR_PASSWORD:
        description: Container registry password
        required: true
      NEXUS_USERNAME:
        description: Nexus package index username
        required: true
      NEXUS_PASSWORD:
        description: Nexus package index password
        required: true
      RBLN_INDEX_USERNAME:
        description: RBLN package index username
        required: true
      RBLN_INDEX_PASSWORD:
        description: RBLN package index password
        required: true

permissions:
  contents: read

jobs:
  lint_source:
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(inputs.python_versions) }}
        build_type: ${{ fromJSON(inputs.build_types) }}
    uses: ./.github/workflows/_lint-source.yaml
    with:
      torch_rbln_sha: ${{ inputs.torch_rbln_sha }}
      python_version: ${{ matrix.python_version }}
      build_type: ${{ matrix.build_type }}
      base_revision: ${{ inputs.base_revision }}
    secrets:
      GIT_PAT: ${{ secrets.GIT_PAT }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      RBLN_INDEX_USERNAME: ${{ secrets.RBLN_INDEX_USERNAME }}
      RBLN_INDEX_PASSWORD: ${{ secrets.RBLN_INDEX_PASSWORD }}

  lint_workflows:
    uses: ./.github/workflows/_lint-workflows.yaml
    with:
      torch_rbln_sha: ${{ inputs.torch_rbln_sha }}
    secrets:
      GIT_PAT: ${{ secrets.GIT_PAT }}
