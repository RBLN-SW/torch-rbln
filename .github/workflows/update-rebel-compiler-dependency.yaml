name: Update rebel-compiler dependency

on:
  schedule:
    # Daily 09:00 KST (00:00 UTC)
    - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      rebel_compiler_version:
        description: rebel-compiler version to pin (leave empty to resolve the latest production build)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update_rebel_compiler_dependency:
    name: Update rebel-compiler dependency
    if: ${{ github.repository_owner == 'RBLN-SW' }}
    runs-on: ${{ vars.TORCH_RBLN_RUNNER_CPU_SMALL }}
    timeout-minutes: 15
    container:
      image: ghcr.io/rebellions-sw/rbln-test:0.11.0-ubuntu22.04-py3.12
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GIT_PAT }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      TARGET_BRANCH: main
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Resolve rebel-compiler version
        id: resolve_rebel_compiler_version
        env:
          UV_INDEX: rbln-nightly=https://nexus.mgmt.rbln.in/repository/pypi-group-nightly/simple/
          UV_INDEX_RBLN_NIGHTLY_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          UV_INDEX_RBLN_NIGHTLY_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          REBEL_COMPILER_VERSION: ${{ inputs.rebel_compiler_version }}
        run: |
          set -euo pipefail

          if [[ -n "${REBEL_COMPILER_VERSION}" ]]; then
            target_version="${REBEL_COMPILER_VERSION}"
            manual_override=true
            echo "::notice::Using explicitly requested rebel-compiler version: ${target_version}"
          else
            # Without --no-config, the constraint pins this to the current build.
            target_version="$(printf 'rebel-compiler\n' \
              | uv pip compile - --no-deps --prerelease allow --no-header --no-annotate --no-config \
              | sed -n 's/^rebel-compiler==//p')"
            if [[ -z "${target_version}" ]]; then
              echo "::error::Failed to resolve rebel-compiler from the index"
              exit 1
            fi
            manual_override=false
            echo "::notice::Resolved latest rebel-compiler version: ${target_version}"
          fi

          echo "target_version=${target_version}" >> "${GITHUB_OUTPUT}"
          echo "manual_override=${manual_override}" >> "${GITHUB_OUTPUT}"

      - name: Check out torch-rbln repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false

      - name: Check whether rebel-compiler pin is outdated
        id: check_rebel_compiler_pin
        env:
          TARGET_VERSION: ${{ steps.resolve_rebel_compiler_version.outputs.target_version }}
          MANUAL_OVERRIDE: ${{ steps.resolve_rebel_compiler_version.outputs.manual_override }}
        run: |
          set -euo pipefail

          current_version="$(uv run --no-config tools/pin_rebel_compiler.py --current)"
          echo "::notice::Target rebel-compiler version:  ${TARGET_VERSION}"
          echo "::notice::Current rebel-compiler version: ${current_version}"

          if [[ "${MANUAL_OVERRIDE}" != "true" && "${TARGET_VERSION}" != *prod ]]; then
            echo "::warning::Latest rebel-compiler '${TARGET_VERSION}' is not a production build; skipping the update"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${current_version}" == "${TARGET_VERSION}" ]]; then
            echo "::notice::Already pinned to target version. No update required."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${MANUAL_OVERRIDE}" != "true" ]]; then
            target_is_newer="$(
              uv run --no-config --no-project --with packaging python - "${TARGET_VERSION}" "${current_version}" <<'PY'
          import sys

          from packaging.version import Version

          # The local segment is a git hash, so a rebuild of the same public version is not newer.
          target, current = (Version(v.split("+", 1)[0]) for v in sys.argv[1:3])
          print("yes" if target > current else "no")
          PY
            )"
            if [[ "${target_is_newer}" != "yes" ]]; then
              echo "::warning::Resolved rebel-compiler '${TARGET_VERSION}' is not newer than the current pin '${current_version}'. No update required."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Update rebel-compiler pin and uv.lock
        if: ${{ steps.check_rebel_compiler_pin.outputs.changed == 'true' }}
        env:
          TARGET_VERSION: ${{ steps.resolve_rebel_compiler_version.outputs.target_version }}
          UV_INDEX_RBLN_USERNAME: ${{ secrets.RBLN_INDEX_USERNAME }}
          UV_INDEX_RBLN_PASSWORD: ${{ secrets.RBLN_INDEX_PASSWORD }}
          UV_INDEX_RBLN_NIGHTLY_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          UV_INDEX_RBLN_NIGHTLY_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          UV_INDEX_RBLN_INTERNAL_USERNAME: ${{ secrets.RBLN_INDEX_USERNAME }}
          UV_INDEX_RBLN_INTERNAL_PASSWORD: ${{ secrets.RBLN_INDEX_PASSWORD }}
        run: |
          set -euo pipefail

          uv run --no-config tools/pin_rebel_compiler.py "${TARGET_VERSION}"
          uv lock

          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "::error::Pinning ${TARGET_VERSION} left pyproject.toml and uv.lock unchanged"
            exit 1
          fi

      - name: Create or update pull request
        if: ${{ steps.check_rebel_compiler_pin.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7.0.11
        env:
          TARGET_VERSION: ${{ steps.resolve_rebel_compiler_version.outputs.target_version }}
        with:
          token: ${{ secrets.GIT_PAT }}
          add-paths: |
            pyproject.toml
            uv.lock
          commit-message: "chore: update rebel-compiler to ${{ env.TARGET_VERSION }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: update-rebel-compiler
          base: ${{ env.TARGET_BRANCH }}
          title: "chore: update rebel-compiler to ${{ env.TARGET_VERSION }}"
          body: |
            Updates the `rebel-compiler` dependency to `${{ env.TARGET_VERSION }}`.

            This PR was automatically created by the dependency-update workflow. If the new version needs code changes to pass CI, push them to this branch before merging.
