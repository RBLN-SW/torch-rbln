---
env:
  TORCH_RBLN_QUEUE_DEFAULT: ${TORCH_RBLN_QUEUE_DEFAULT?}
  TORCH_RBLN_QUEUE_AMD64_NPU: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
  TORCH_RBLN_PYTHON_VERSION: ${TORCH_RBLN_PYTHON_VERSION?}
  TORCH_RBLN_BUILD_TYPE: ${TORCH_RBLN_BUILD_TYPE?}
  TORCH_RBLN_ARTIFACT_BUILD_ID: ${TORCH_RBLN_ARTIFACT_BUILD_ID?}
  TORCH_RBLN_ARTIFACT_DIR: ${TORCH_RBLN_ARTIFACT_DIR?}
  TORCH_RBLN_NPU_PRODUCT: ${TORCH_RBLN_NPU_PRODUCT?}
  TORCH_RBLN_EXCLUDE_PERIODIC: ${TORCH_RBLN_EXCLUDE_PERIODIC?}
  TORCH_RBLN_TEST_SUITES: ${TORCH_RBLN_TEST_SUITES?}

common:
  test-image: &test-image >-
    harbor.k8s.rebellions.in/rebellions-sw/rbln-test:0.12.0rc0-ubuntu24.04-py${TORCH_RBLN_PYTHON_VERSION?}
  index-secrets: &index-secrets
    UV_INDEX_RBLN_USERNAME: REBEL_SW_DEV_USERNAME
    UV_INDEX_RBLN_PASSWORD: REBEL_SW_DEV_PASSWORD
    UV_INDEX_RBLN_NIGHTLY_USERNAME: MGMT_NEXUS_USERNAME
    UV_INDEX_RBLN_NIGHTLY_PASSWORD: MGMT_NEXUS_PASSWORD
    UV_INDEX_RBLN_INTERNAL_USERNAME: REBEL_SW_DEV_USERNAME
    UV_INDEX_RBLN_INTERNAL_PASSWORD: REBEL_SW_DEV_PASSWORD
  npu-test: &npu-test
    secrets: *index-secrets
    plugins:
      - kubernetes:
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 4Gi
    image: *test-image

steps:
  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?}, core, 0 NPUs)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-core-0-npus
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite core \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 0 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_DEFAULT?}
    env:
      LD_LIBRARY_PATH: ${UMD_PATH}
    secrets: *index-secrets
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,core,/'
    timeout_in_minutes: 10
    image: *test-image
    resources:
      cpu:
        requests: "32"
        limits: "32"

  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?}, core, 1 NPU)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-core-1-npu
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite core \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 1 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,core,/'
    timeout_in_minutes: 20
    resources:
      cpu:
        requests: "32"
        limits: "32"
      npu:
        count: 1
        product:
          - ${TORCH_RBLN_NPU_PRODUCT?}
    <<: *npu-test

  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?}, core, 2 NPUs)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-core-2-npus
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite core \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 2 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,core,/'
    timeout_in_minutes: 10
    resources:
      cpu:
        requests: "32"
        limits: "32"
      npu:
        count: 2
        product:
          - ${TORCH_RBLN_NPU_PRODUCT?}
    <<: *npu-test

  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?}, distributed, 1 NPU)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-distributed-1-npu
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite distributed \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 1 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,distributed,/'
    timeout_in_minutes: 10
    resources:
      cpu:
        requests: "32"
        limits: "32"
      npu:
        count: 1
        product:
          - ${TORCH_RBLN_NPU_PRODUCT?}
    <<: *npu-test

  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?},
      distributed, 2 NPUs)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-distributed-2-npus
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite distributed \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 2 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,distributed,/'
    timeout_in_minutes: 70
    resources:
      cpu:
        requests: "32"
        limits: "32"
      npu:
        count: 2
        product:
          - ${TORCH_RBLN_NPU_PRODUCT?}
    <<: *npu-test

  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?},
      distributed, 4 NPUs)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-distributed-4-npus
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite distributed \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 4 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,distributed,/'
    timeout_in_minutes: 20
    resources:
      cpu:
        requests: "32"
        limits: "32"
      npu:
        count: 4
        product:
          - ${TORCH_RBLN_NPU_PRODUCT?}
    <<: *npu-test

  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?},
      distributed, 8 NPUs)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-distributed-8-npus
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite distributed \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 8 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,distributed,/'
    timeout_in_minutes: 20
    resources:
      cpu:
        requests: "32"
        limits: "32"
      npu:
        count: 8
        product:
          - ${TORCH_RBLN_NPU_PRODUCT?}
    <<: *npu-test

  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?}, ops, 1 NPU)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-ops-1-npu
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite ops \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 1 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,ops,/'
    timeout_in_minutes: 20
    resources:
      cpu:
        requests: "32"
        limits: "32"
      npu:
        count: 1
        product:
          - ${TORCH_RBLN_NPU_PRODUCT?}
    <<: *npu-test

  - label: >-
      Run Python tests (py${TORCH_RBLN_PYTHON_VERSION?}, x86_64,
      ${TORCH_RBLN_BUILD_TYPE?}, ${TORCH_RBLN_NPU_PRODUCT?}, models, 1 NPU)
    key: >-
      run-python-tests-py${TORCH_RBLN_PYTHON_VERSION?}-x86_64-${TORCH_RBLN_BUILD_TYPE?}-${TORCH_RBLN_NPU_PRODUCT?}-models-1-npu
    command: |
      .buildkite/scripts/test/run-python-tests.sh \
        --build-type ${TORCH_RBLN_BUILD_TYPE?} \
        --artifact-build-id ${TORCH_RBLN_ARTIFACT_BUILD_ID?} \
        --artifact-dir ${TORCH_RBLN_ARTIFACT_DIR?} \
        --exclude-periodic ${TORCH_RBLN_EXCLUDE_PERIODIC?} \
        --test-suite models \
        --npu-product ${TORCH_RBLN_NPU_PRODUCT?} \
        --num-npus 1 \
        --num-workers 32
    agents:
      queue: ${TORCH_RBLN_QUEUE_AMD64_NPU?}
    env:
      HF_HOME: /mnt/shared_data/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    if: '",${TORCH_RBLN_TEST_SUITES?}," =~ /,models,/'
    timeout_in_minutes: 30
    resources:
      cpu:
        requests: "32"
        limits: "32"
      npu:
        count: 1
        product:
          - ${TORCH_RBLN_NPU_PRODUCT?}
    <<: *npu-test
