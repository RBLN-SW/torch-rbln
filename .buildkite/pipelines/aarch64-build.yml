env:
  # The agent interpolates each value with only the ones above it, so an
  # image that joins other values must come after them.
  TORCH_RBLN_IMAGE_REGISTRY: >-
    ${TORCH_RBLN_IMAGE_REGISTRY:-harbor.k8s.rebellions.in}
  TORCH_RBLN_BUILD_IMAGE_REPOSITORY: >-
    ${TORCH_RBLN_BUILD_IMAGE_REPOSITORY:-rebellions-sw/rbln-build}
  TORCH_RBLN_BUILD_IMAGE_TAG: ${TORCH_RBLN_BUILD_IMAGE_TAG:-0.12.0rc0-ubi9.8}
  TORCH_RBLN_BUILD_IMAGE: >-
    ${TORCH_RBLN_IMAGE_REGISTRY}/${TORCH_RBLN_BUILD_IMAGE_REPOSITORY}:${TORCH_RBLN_BUILD_IMAGE_TAG}
  TORCH_RBLN_PYTHON_VERSION: ${TORCH_RBLN_PYTHON_VERSION:-3.12}
  TORCH_RBLN_BUILD_TYPE: ${TORCH_RBLN_BUILD_TYPE:-Release}

steps:
  - group: Publish (aarch64)
    steps:
      - label: >-
          Build wheel (py${TORCH_RBLN_PYTHON_VERSION?}, aarch64,
          ${TORCH_RBLN_BUILD_TYPE?})
        key: >-
          build-wheel-py${TORCH_RBLN_PYTHON_VERSION?}-aarch64-${TORCH_RBLN_BUILD_TYPE?}
        command: |
          .buildkite/scripts/packaging/build-wheel.sh \
            --python-version ${TORCH_RBLN_PYTHON_VERSION?} \
            --build-type ${TORCH_RBLN_BUILD_TYPE?}
        # The arm64 agents are VMs outside the Kubernetes stacks, so the
        # `docker` plugin runs the build image. `propagate-environment` leaves
        # out the secrets, which `environment` forwards by name.
        agents:
          queue: vm
          arch: arm64
        secrets:
          UV_INDEX_RBLN_USERNAME: REBEL_SW_DEV_USERNAME
          UV_INDEX_RBLN_PASSWORD: REBEL_SW_DEV_PASSWORD
          UV_INDEX_RBLN_NIGHTLY_USERNAME: MGMT_NEXUS_USERNAME
          UV_INDEX_RBLN_NIGHTLY_PASSWORD: MGMT_NEXUS_PASSWORD
          UV_INDEX_RBLN_INTERNAL_USERNAME: REBEL_SW_DEV_USERNAME
          UV_INDEX_RBLN_INTERNAL_PASSWORD: REBEL_SW_DEV_PASSWORD
        plugins:
          - docker#v5.14.0:
              image: ${TORCH_RBLN_BUILD_IMAGE?}-py${TORCH_RBLN_PYTHON_VERSION?}
              propagate-environment: true
              mount-buildkite-agent: true
              # The container runs as root, so `chown` gives the checkout back
              # to the agent's user for the next job on this VM to clean.
              chown: true
              chown-image: >-
                ${TORCH_RBLN_BUILD_IMAGE?}-py${TORCH_RBLN_PYTHON_VERSION?}
              environment:
                - BUILDKITE_AGENT_ENDPOINT=https://obedients-api.k8s.rebellions.in/v3
                - GIT_CONFIG_COUNT=1
                - GIT_CONFIG_KEY_0=safe.directory
                - GIT_CONFIG_VALUE_0=/workdir
                - UV_INDEX_RBLN_USERNAME
                - UV_INDEX_RBLN_PASSWORD
                - UV_INDEX_RBLN_NIGHTLY_USERNAME
                - UV_INDEX_RBLN_NIGHTLY_PASSWORD
                - UV_INDEX_RBLN_INTERNAL_USERNAME
                - UV_INDEX_RBLN_INTERNAL_PASSWORD
        timeout_in_minutes: 30

      - label: >-
          Publish wheel (py${TORCH_RBLN_PYTHON_VERSION?}, aarch64,
          ${TORCH_RBLN_BUILD_TYPE?})
        key: >-
          publish-wheel-py${TORCH_RBLN_PYTHON_VERSION?}-aarch64-${TORCH_RBLN_BUILD_TYPE?}
        command: |
          .buildkite/scripts/publishing/publish-wheel.sh \
            --python-version ${TORCH_RBLN_PYTHON_VERSION?} \
            --cpu-architecture aarch64 \
            --build-type ${TORCH_RBLN_BUILD_TYPE?} \
            --index rbln-internal
        agents:
          queue: udc
        depends_on:
          - build-wheel-py${TORCH_RBLN_PYTHON_VERSION?}-aarch64-${TORCH_RBLN_BUILD_TYPE?}
        secrets:
          UV_INDEX_RBLN_INTERNAL_USERNAME: REBEL_SW_DEV_USERNAME
          UV_INDEX_RBLN_INTERNAL_PASSWORD: REBEL_SW_DEV_PASSWORD
        timeout_in_minutes: 5
        image: ${TORCH_RBLN_BUILD_IMAGE?}-py3.12
