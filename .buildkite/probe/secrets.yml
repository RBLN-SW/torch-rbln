steps:
  - label: "probe: the index credentials reach a step and authenticate"
    key: probe-index-credentials
    image: ${TORCH_RBLN_BUILD_IMAGE?}-py3.12
    agents:
      queue: udc
    timeout_in_minutes: 15
    secrets:
      UV_INDEX_RBLN_USERNAME: REBEL_SW_DEV_USERNAME
      UV_INDEX_RBLN_PASSWORD: REBEL_SW_DEV_PASSWORD
      UV_INDEX_RBLN_NIGHTLY_USERNAME: MGMT_NEXUS_USERNAME
      UV_INDEX_RBLN_NIGHTLY_PASSWORD: MGMT_NEXUS_PASSWORD
      UV_INDEX_RBLN_INTERNAL_USERNAME: REBEL_SW_DEV_USERNAME
      UV_INDEX_RBLN_INTERNAL_PASSWORD: REBEL_SW_DEV_PASSWORD
    checkout:
      sparse:
        paths:
          - .buildkite
    command: |
      set -euo pipefail

      declare -A urls=(
        [rbln]=https://pypi.rbln.ai/simple/
        [rbln-nightly]=https://nexus.mgmt.rbln.in/repository/pypi-group-nightly/simple/
        [rbln-internal]=https://pypi.rebellions.in/simple/
      )
      failed=0
      for index in rbln rbln-nightly rbln-internal; do
        name="UV_INDEX_$${index^^}"
        name="$${name//-/_}"
        username_var="$${name}_USERNAME"
        password_var="$${name}_PASSWORD"
        if [[ -z "$${!username_var:-}" || -z "$${!password_var:-}" ]]; then
          echo "error: $${username_var} or $${password_var} is empty" >&2
          failed=1
          continue
        fi
        url="$${urls[$${index}]}"
        url="$${url%/}/rebel-compiler/"
        status="$$(
          curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 60 \
            --user "$${!username_var}:$${!password_var}" \
            "$${url}"
        )"
        echo "$${index}: $${url} returned HTTP $${status}"
        case "$${status}" in
          200 | 404) ;;
          *) failed=1 ;;
        esac
      done
      exit "$${failed}"

  - label: "probe: GH_TOKEN works for gh and git in the test image"
    key: probe-github-token
    image: ${TORCH_RBLN_TEST_IMAGE?}-py3.12
    agents:
      queue: udc
    timeout_in_minutes: 15
    env:
      GH_REPO: RBLN-SW/torch-rbln
    secrets:
      GH_TOKEN: GIT_PAT
    checkout:
      sparse:
        paths:
          - .buildkite
    command: |
      set -euo pipefail

      gh --version
      gh api "repos/{owner}/{repo}" --jq .full_name
      gh auth setup-git --hostname github.com
      git ls-remote "https://github.com/$${GH_REPO}.git" HEAD
