[project]
name = "torch-rbln"
dynamic = ["version"]
description = "Rebellions Extension for PyTorch"
authors = [{ name = "Rebellions Inc.", email = "client_support@rebellions.ai" }]
readme = "README.md"
license = "Apache-2.0"
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10,<3.15"
dependencies = ["torch==2.13.0+cpu"]

[project.optional-dependencies]
runtime = ["rebel-compiler~=0.12.1.dev364"]

[project.entry-points]
"torch.backends" = { autoload = "torch_rbln:torch_backends_entry_point" }

[build-system]
requires = [
  "cmake>=4.4.4,<4.5.0",
  "hatchling>=1.32.4,<1.33.0",
  "ninja>=1.13.2,<1.14.0",
  "packaging>=26.3,<26.4",
  "pyyaml>=6.0.3,<6.1.0",
  "rebel-compiler",                 # `[tool.uv].build-constraint-dependencies` pins the version.
  "setuptools-scm>=10.3.4,<10.4.0",
  "torch==2.13.0+cpu",
]
build-backend = "hatchling.build"

[tool.hatch.version]
# Version is derived from Git tags by `setuptools-scm`.
# See `docs/RELEASE_PROCESS.md` for the tag-to-version mapping.
source = "code"
path = "tools/get_version.py"
expression = "compute_version()"

[tool.hatch.metadata]
# Allow `file://` direct references for build-time dependency pinning
# (e.g., `replace_depends.py` pins a local `rebel-compiler` wheel in `pyproject.toml`).
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
  "CMakeLists.txt",
  "aten/**/*.cmake",
  "aten/**/*.cpp",
  "aten/**/*.h",
  "aten/**/*.hpp",
  "aten/**/CMakeLists.txt",
  "aten/**/*.yaml",
  "c10/**/*.cmake",
  "c10/**/*.cpp",
  "c10/**/*.h",
  "c10/**/*.hpp",
  "c10/**/CMakeLists.txt",
  "cmake/**/*.cmake",
  "cmake/**/*.in",
  "tools/**/*.py",
  "tools/**/*.sh",
  "torch_rbln/**/*.py",
  "torch_rbln/**/*.pyi",
  "test/cpp/**/*.cpp",
  "test/cpp/**/CMakeLists.txt",
  "torch_rbln/csrc/**/*.cmake",
  "torch_rbln/csrc/**/*.cpp",
  "torch_rbln/csrc/**/*.h",
  "torch_rbln/csrc/**/*.hpp",
  "torch_rbln/csrc/**/CMakeLists.txt",
  "hatch_build.py",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
]
exclude = [
  "**/*.pyc",
  "**/.env",
  "**/.env/",
  "**/.venv/",
  "**/__pycache__/",
  "**/env/",
  "**/venv/",
]

[tool.hatch.build.targets.wheel]
packages = ["torch_rbln"]
exclude = ["torch_rbln/csrc/**"]
only-include-required = false
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# `uv build` does not read the lockfile, so `build-constraint-dependencies` pins the build environment.
# It must match `constraint-dependencies`, or the extension compiles against one build and loads another.
build-constraint-dependencies = ["rebel-compiler==0.12.1.dev364+gcb7d8e1c.prod"]
constraint-dependencies = ["rebel-compiler==0.12.1.dev364+gcb7d8e1c.prod"]
# `rebel-compiler` publishes wheels for Linux only.
environments = ["sys_platform == 'linux'"]
# Without `unsafe-first-match`, `uv` takes `rebel-compiler` only from the first
# index that contains it, which need not hold the build that
# `constraint-dependencies` pins.
index-strategy = "unsafe-first-match"

# Listing `pypi` first makes it outrank the rbln indexes; without the entry,
# PyPI ranks last as the implicit default.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[[tool.uv.index]]
name = "rbln"
url = "https://pypi.rbln.ai/simple/"

[[tool.uv.index]]
name = "rbln-nightly"
url = "https://nexus.mgmt.rbln.in/repository/pypi-group-nightly/simple/"
publish-url = "https://nexus.mgmt.rbln.in/repository/pypi-torch-rbln-nightly/"

[[tool.uv.index]]
name = "rbln-internal"
url = "https://pypi.rebellions.in/simple/"
publish-url = "https://pypi.rebellions.in/"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
# The `build` group lists the build requirements because
# `uv pip install --no-build-isolation` does not install them.
build = [
  "cmake>=4.4.4,<4.5.0",
  "editables>=0.6,<0.7",
  "hatchling>=1.32.4,<1.33.0",
  "ninja>=1.13.2,<1.14.0",
  "packaging>=26.3,<26.4",
  "pyyaml>=6.0.3,<6.1.0",
  "rebel-compiler",                 # `[tool.uv].constraint-dependencies` pins the version.
  "setuptools-scm>=10.3.4,<10.4.0",
  "torch==2.13.0+cpu",
]
ci = [
  "packaging>=26.3,<26.4",
  "PyGithub>=2.10.0,<2.11.0",
  "requests>=2.34.2,<2.35.0",
  "tomli>=2.5.0,<2.6.0; python_version < '3.11'",
  "tomlkit>=0.15.2,<0.16.0",
]
lint = [
  { include-group = "ci" },
  "deptry>=0.25.1,<0.26.0",
  "lintrunner==0.12.11",
  "rumdl>=0.3.0,<0.4.0",
  "taplo>=0.9.3,<0.10.0",
  "yamllint>=1.38.0,<1.39.0",
]
test = [
  "expecttest>=0.3.0,<0.4.0",
  "pytest>=9.1.1,<9.2.0",
  "pytest-xdist>=3.8.0,<3.9.0",
  "pyyaml>=6.0.3,<6.1.0",
  "transformers==4.49.0",
]
dev = [
  { include-group = "build" },
  { include-group = "ci" },
  { include-group = "lint" },
  { include-group = "test" },
]

[tool.black]
# `usort` reads its line length from this table.
line-length = 120


[tool.isort]
src_paths = ["torch_rbln", "test"]
skip_gitignore = true
atomic = true
profile = "black"
lines_after_imports = 2
combine_as_imports = true


[tool.usort.known]
first_party = ["codegen", "torch_rbln", "test"]
standard_library = ["typing_extensions"]


[tool.ruff]
line-length = 120


[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # These rules conflict with the formatter:
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "COM812",
  "COM819",
  "D203",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "W191",
  # This rule contradicts D212, which the docstrings follow.
  "D213",
  # PYFMT sorts imports in an order that these rules flag.
  "I",
  # Docstrings are optional, and their wording and sections are up to the author.
  "D1",
  "D205",
  "D301",
  "D400",
  "D401",
  "D402",
  "D403",
  "D404",
  "D405",
  "D406",
  "D407",
  "D409",
  "D413",
  "D414",
  "D415",
  "D416",
  "D417",
  "D418",
  "D419",
  # Type annotations, TODO comments, and function complexity are judgment calls.
  "ANN",
  "C901",
  "FIX",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "TD",
  # The code relies on broad `except` clauses, module globals, and private members of
  # `torch` and `torch_rbln`.
  "BLE001",
  "PLW0603",
  "SLF001",
]


[tool.ruff.lint.per-file-ignores]
# Tests use PyTorch's `TestCase` assertions, which compare tensors.
"test/**" = ["PT009", "PT027", "S101", "S603"]
# CI shell steps read what these scripts print.
".buildkite/**" = ["INP001", "T201"]
# This package is imported as both `codegen` and `tools.codegen`.
"tools/codegen/**" = ["TID252"]


[tool.ruff.lint.flake8-builtins]
# The code names tensor arguments and variables `input`, as PyTorch does.
ignorelist = ["input"]


[tool.ruff.lint.pep8-naming]
# These names mirror `torch.cuda` context managers and the custom ops.
extend-ignore-names = ["custom_rbln_*", "device", "device_of"]


[tool.ruff.lint.pycodestyle]
max-doc-length = 88


[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "float", "int", "str"]


[tool.codespell]
ignore-words = "tools/linter/dictionary.txt"
builtin = "clear,rare,informal,usage,en-GB_to_en-US"
check-filenames = true
check-hidden = true


[tool.pytest.ini_options]
# `--verbose`: show each test name and result for better visibility
# `-rEfX`: show extra summary for (E)rror, (f)ailed, and (X)passed tests
# `--tb=native`: use standard Python traceback format for debugging
# `-p no:warnings`: disable warnings plugin to keep test output clean
# `--assert=plain`: disable assertion rewriting to avoid import-order conflicts (see upstream PR #117060)
# `--max-worker-restart=0`: fail immediately on worker crash instead of restarting
# `--strict-markers`: fail on any marker not registered in `markers`
addopts = "--verbose -rEfX --tb=native -p no:warnings --assert=plain --max-worker-restart=0 --strict-markers"
testpaths = ["test"]
xfail_strict = true
markers = [
  "periodic: marks tests that only the release checks run (deselect with '-m \"not periodic\"')",
  "serial: marks tests that must run on a single worker (deselect with '-m \"not serial\"')",
  "npu(count=N): marks tests that require N NPUs; N=0 marks tests that run only without an NPU (select with '-m \"npu(count=N)\"')",
  "no_dynamo_reset: skips autouse TorchDynamo reset fixture",
  "torch_rbln_only: marks tests whose outcome does not depend on rebel-compiler -- torch-rbln's own logic, packaging, or the torch-facing contract. rebel_compiler's CI deselects these (`-m \"not torch_rbln_only\"`); torch-rbln's own lanes still run them",
]
