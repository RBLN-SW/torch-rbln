[[linter]]
code = 'CLANGFORMAT'
include_patterns = ['**/*.c', '**/*.cc', '**/*.cpp', '**/*.h', '**/*.hpp']
init_command = [
  'python3',
  'tools/linter/adapters/s3_init.py',
  '--config-json=tools/linter/adapters/s3_init_config.json',
  '--linter=clang-format',
  '--dry-run={{DRYRUN}}',
  '--output-dir=.lintbin',
  '--output-name=clang-format',
]
command = [
  'python3',
  'tools/linter/adapters/clangformat_linter.py',
  '--binary=.lintbin/clang-format',
  '--',
  '@{{PATHSFILE}}',
]
is_formatter = true

[[linter]]
code = 'PYREFLY'
include_patterns = ['**/*.py', '**/*.pyi']
exclude_patterns = [
  # Vendored from upstream PyTorch.
  'tools/linter/**',
]
command = [
  'uv',
  'run',
  '--script',
  'tools/linter/adapters/pyrefly_linter.py',
  '--config=pyrefly.toml',
]

